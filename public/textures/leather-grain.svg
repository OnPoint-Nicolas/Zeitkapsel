<svg xmlns="http://www.w3.org/2000/svg" width="380" height="380" viewBox="0 0 380 380">
  <defs>
    <filter id="leatherGrain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.26 0.31" numOctaves="3" seed="24" result="grain" />
      <feTurbulence type="fractalNoise" baseFrequency="0.022 0.017" numOctaves="2" seed="12" result="naturalVariation" />
      <feDisplacementMap in="grain" in2="naturalVariation" scale="14" xChannelSelector="R" yChannelSelector="G" result="irregularGrain" />
      <feDiffuseLighting in="irregularGrain" surfaceScale="1.05" diffuseConstant="0.85" lighting-color="#ffffff" result="relief">
        <feDistantLight azimuth="225" elevation="48" />
      </feDiffuseLighting>
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="7" result="fibres" />
      <feBlend in="relief" in2="fibres" mode="soft-light" result="fineGrain" />
      <feColorMatrix in="naturalVariation" type="saturate" values="0" result="mottling" />
      <feComposite in="fineGrain" in2="mottling" operator="arithmetic" k1="0" k2="0.88" k3="0.12" k4="0" />
    </filter>
  </defs>
  <path d="M0 0h380v380H0z" filter="url(#leatherGrain)" />
</svg>
